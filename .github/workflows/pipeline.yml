name: CI/CD Simulation

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          echo "Starting tests..."
          sleep 2
          echo "Tests passed!"

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        run: echo "Deploying application to production..."
