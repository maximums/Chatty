name: CI/CD Simulation

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run unit tests
        env:
          JUST_VAR: ${{ vars.MY_REPO_VAR }}
        run: |
          echo "Starting tests..."
          sleep 2
          mkdir build
          echo "This is the compiled binary code." > build/app.txt
          echo "Also used the variable: 'JUST_VAR':= $JUST_VAR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-binary
          path: build/app.txt

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-app-binary

      - name: Deploy to Server
        run: |
          echo "Deploying application to production..."
          ls -l app.txt
          cat app.txt

      - name: Simulate Login
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          echo "Connecting to server..."
          echo "Using Key: $API_KEY"